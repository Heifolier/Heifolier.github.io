<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace }}">
    <meta name="author" content="Shuo Zhang">
    <meta name="theme-color" content="#f5f3ec">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page.url == '/' %}Shuo Zhang · Robotics Researcher{% else %}{{ page.title }} · Shuo Zhang{% endif %}">
    <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace }}">
    <meta property="og:image" content="{{ '/images/profile.png' | absolute_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <title>{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Shuo Zhang home">
        <span>Shuo Zhang</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a>
        <a href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} class="active"{% endif %}>Research</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.url == '/cv/' %} class="active"{% endif %}>CV</a>
      </nav>
    </header>

    <main class="site-main{% if page.url != '/' %} inner-page{% endif %}">
      {% if page.url != '/' %}<div class="page-heading"><p class="eyebrow">Shuo Zhang</p><h1>{{ page.title }}</h1></div>{% endif %}
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-identity"><div><strong>Shuo Zhang</strong><p>Peking University · Beijing, China</p></div></div>
      <div class="footer-links">
        <a href="mailto:heifolier@stu.pku.edu.cn" aria-label="Email Shuo Zhang">Email</a>
        <a href="https://github.com/Heifolier" aria-label="Shuo Zhang on GitHub">GitHub</a>
        <a href="{{ '/files/cv.pdf' | relative_url }}" aria-label="Download Shuo Zhang's CV">CV</a>
      </div>
    </footer>
  </body>
</html>
