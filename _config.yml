# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the
# server process.

# Basic Site Settings
locale                   : "en-US"
title                    : "Shuo Zhang"
title_separator          : "-"
name                     : "Shuo Zhang"
description              : "Shuo Zhang — Physical AI and Robotics"
url                      : "https://heifolier.github.io"
baseurl                  : ""
repository               : "Heifolier/Heifolier.github.io"

# Site Author - rendered on the homepage and in the footer by
# _layouts/profile.html. Only the fields that layout actually reads are kept.
author:
  avatar           : "profile.png"
  name             : "Shuo Zhang (张硕)"
  bio              : "M.S. student at Peking University working on Physical AI and Robotics."
  location         : "Beijing, China"
  employer         : "Peking University"
  email            : "heifolier@stu.pku.edu.cn"
  github           : "heifolier"

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/ for social media previews
future                   : true

# Social Sharing
og_image                 :  # Social media default site image
og_description           :  # Social media default site image description
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - .asset-cache
  - .bundle
  - .github
  - .sass-cache
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# These settings control how pages are included in the site. Every page in
# _pages/ is rendered with the custom profile layout.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: profile


# Sass/SCSS - assets/css/main.scss is the only stylesheet and has no partials.
sass:
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai


# Plugins - all of these ship with the github-pages gem, which is what builds
# this site both locally and in .github/workflows/pages.yml.
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
